apiVersion: apps/v1
kind: Deployment
metadata:
  name: silly-golf
  labels:
    app: silly-golf
spec:
  # Room state lives in the server process + a single rooms.json on this PVC.
  # Do NOT scale past 1 (in-memory room map + ReadWriteOnce volume).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silly-golf
  template:
    metadata:
      labels:
        app: silly-golf
    spec:
      containers:
        - name: server
          image: registry.kieffer.me/silly-golf:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: DATA_FILE
              value: /data/rooms.json
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: silly-golf-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: silly-golf-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # rooms.json is a few KB; 10Mi is plenty, keep it small per request
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: silly-golf
spec:
  selector:
    app: silly-golf
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: silly-golf
  annotations:
    # WebSocket upgrade for /ws (default on nginx ingress, kept explicit)
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: silly-golf.kieffer.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: silly-golf
                port:
                  number: http
